<head>
<meta charset="utf-8">

<link rel="stylesheet" href="css/okean.css?v=2">
</head>
<body>

<!-- The dive: the deeper it goes, the more of her there is, until it all settles into one shape. -->
<main class="sea" id="sea">
  <div class="sea__deep" id="deep"></div>
  <div class="rays" id="rays"></div>
  <div class="bloom" id="bloom"></div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="tiles" id="tiles"></div>
  <div class="shade"></div>
  <canvas class="fx fx--top" id="fx2" aria-hidden="true"></canvas>

  <div class="say" aria-live="polite">
    <p class="ln" data-in="-3.2" data-out="0.5">Seni xafa qilgan bo‘lsam, meni kechir.</p>
    <p class="ln" data-in="1" data-out="7.5">Har bir rasmingga qarab, seni sog‘indim.</p>
    <p class="ln" data-in="9" data-out="15">Bilib qo‘y: <em>seni juda-juda sevaman.</em></p>
  </div>
  <div class="end" id="end">
    <p class="end__t">Sen &mdash; mening hayotimsan.</p>
    <p class="end__s">Har kuni yana chuqurroq sevaman.</p>
  </div>

  <div class="fin" id="fin">
    <p class="fin__hint">Rasmlarga bosing &middot; suvga ham tegib ko‘ring</p>
    <button class="btn" id="again" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>Yana bir bor</button>
  </div>
</main>

<!-- The surface: one tap is the dive, and the tap that lets the song play. -->
<button class="gate" id="gate" type="button" disabled aria-label="Sovg‘ani ochish">
  <canvas class="gate__sky" id="gateSky" aria-hidden="true"></canvas>
  <span class="gate__moon"></span>
  <span class="gate__txt">
    <small>Kamola</small>
    <b>Sen uchun<br>sovg‘am bor</b>
  </span>
  <span class="gate__water">
    <span class="gate__cta"><i></i><span id="gateMsg">Tayyorlanmoqda…</span></span>
    <span class="gate__bar"><i id="gateBar"></i></span>
    <span class="gate__sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>Ovozni balandroq qiling</span>
  </span>
</button>

<button class="resume" id="resume" type="button" hidden>Davom ettirish</button>
<div class="lb" id="lb" hidden></div>

<audio id="song" preload="auto" playsinline></audio>
<script>window.NAME = "Kamola";</script>
<script src="js/media.js?v=2"></script>
<script src="js/gate.js?v=2"></script>
<script src="js/okean.js?v=2"></script>
</body>
</html>
